name: Daily Automated Learning Bot

on:
  schedule:
    # 00:00 UTC = 07:00 AM Vietnam Time (UTC+7)
    - cron: '0 0 * * *'
  # Cho phép bấm nút "Run workflow" trên giao diện web để chạy thử nghiệm bất cứ lúc nào
  workflow_dispatch:

jobs:
  run-daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Cài đặt thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install playwright httpx google-genai python-dotenv

      - name: 🌐 Cài đặt Playwright Chromium & Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: 🚀 Chạy Bot Tự Động Hóa (Playwright -> Gemini -> Telegram)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.main
