name: Daily Automated Learning Bot

on:
  schedule:
    # 23:35 UTC = 06:35 AM Vietnam Time (UTC+7)
    # LƯU Ý: Tránh mốc 00:00 UTC vì toàn cầu cùng chạy cron khiến GitHub Actions runner nghẽn hàng đợi trễ 1-3 tiếng!
    # Lùi lại 23:35 UTC giúp chạy vào khung giờ vắng, tin nhắn sẽ đến đều đặn quanh 06:40 - 07:00 AM VN.
    - cron: '35 23 * * *'
  # Cho phép bấm nút "Run workflow" trên giao diện web để chạy thử nghiệm bất cứ lúc nào
  workflow_dispatch:

jobs:
  run-daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Cài đặt thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install playwright httpx google-genai python-dotenv

      - name: 🌐 Cài đặt Playwright Chromium & Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: 🚀 Chạy Bot Tự Động Hóa (Playwright -> Gemini -> Telegram)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.main

      - name: 💾 Lưu lịch sử bài viết đã gửi (Deduplication Persistence)
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(history): update sent papers [skip ci]"
            git push
          fi
